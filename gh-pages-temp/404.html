<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Redirecting...</title>
    <script>
      // Redirect to index.html with hash preserving path so SPA can handle routing
      (function () {
        try {
          var path = location.pathname + location.search + location.hash;
          // make path relative and ensure leading slash after hash
          var target = './index.html#' + (path || '/');
          location.replace(target);
        } catch (e) {
          location.replace('./index.html');
        }
      })();
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
